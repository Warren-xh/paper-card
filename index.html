<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文献卡片</title>
<meta name="description" content="论文阅读卡片：读一篇，记一张；回头看，一眼想起。">
<meta name="theme-color" content="#f1efe8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='26' height='20' rx='2' fill='%23fff' stroke='%231f5f8b' stroke-width='2'/%3E%3Cpath d='M3 12h26' stroke='%23d9485f' stroke-width='2'/%3E%3Cpath d='M8 17h16M8 21h11' stroke='%231f5f8b' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<script>
  try {
    const t = localStorage.getItem("pc-theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch {}
</script>
</head>
<body>
<a class="skip" href="#main">跳到正文</a>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/" id="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="1.5"/><path d="M2.5 9h19" class="brand-margin"/><path d="M6 13h12M6 16h8"/></svg>
      <span id="brandName">文献卡片</span>
    </a>
    <div class="mode-switch" role="group" aria-label="切换模式"><a href="#/" data-mode="cards">文献</a><a href="#/lab" data-mode="lab">实操</a><a href="#/map" data-mode="map">导图</a></div>
    <nav class="topnav" aria-label="主导航">
      <a href="#/review" data-nav="review">回顾<span class="nav-badge" id="dueBadge" hidden></span></a>
      <a href="#/settings" data-nav="settings">设置</a>
      <button type="button" class="icon-btn" id="themeBtn" aria-label="切换明暗主题" title="切换明暗主题">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
      <button type="button" class="lock-btn" id="lockBtn"></button>
    </nav>
  </div>
</header>
<main id="main" tabindex="-1"><p class="loading">正在打开卡片…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dialog"></dialog>
<script type="module" src="js/app.mjs"></script>
</body>
</html>
